<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-12">
        <h:form id="formPlaats">
          <d:titel titel="#{sedesPlaats.subTitel} - #{gebruiker.locale}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.plaatsnaam')}" />
                <div class="field-body is-normal">
                  <d:inputText id="naam" value="#{sedesPlaats.plaats.plaatsnaam}" maxlength="100" size="100" required="true" readonly="#{sedesPlaats.aktie.readonly}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.land')}" />
                <div class="field-body is-normal">
                  <d:listbox id="landId" value="#{sedesPlaats.plaats.landId}" fullwidth="true" required="true" readonly="#{sedesPlaats.aktie.readonly}" items="#{sedesLand.selectLandnamen()}" textvalue="#{sedesLand.i18nLandnaam(sedesPlaats.plaats.landId)}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.regionaam')}" />
                <div class="field-body is-normal">
                  <d:listbox id="regioId" value="#{sedesPlaats.plaats.regioId}" fullwidth="true" required="true" readonly="#{sedesPlaats.aktie.readonly}" items="#{sedesRegio.selectRegios()}" textvalue="#{sedesRegio.getRegio(sedesPlaats.plaats.regioId).naam}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.postkode')}" />
                <div class="field-body is-normal">
                  <d:inputText id="postkode" value="#{sedesPlaats.plaats.postkode}" maxlength="5" size="10" readonly="#{sedesPlaats.aktie.readonly}" />
                  <d:label label="#{i18nTeksten.tekst('label.zonenummer')}" />
                  <div class="field-body is-normal">
                    <d:inputText id="zonenummer" value="#{sedesPlaats.plaats.zonenummer}" maxlength="6" size="11" readonly="#{sedesPlaats.aktie.readonly}" />
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.breedtegraad')}" />
                <div class="field-body is-normal">
                  <d:inputText id="breedtegraad" value="#{sedesPlaats.plaats.breedtegraad}" pattern="#0.000000" maxlength="10" size="10" readonly="#{sedesPlaats.aktie.readonly}" />
                  <d:label label="#{i18nTeksten.tekst('label.lengtegraad')}" />
                  <div class="field-body is-normal">
                    <d:inputText id="lengtegraad" value="#{sedesPlaats.plaats.lengtegraad}" pattern="##0.000000" maxlength="11" size="11" readonly="#{sedesPlaats.aktie.readonly}" />
                  </div>
                </div>
              </div>

              <d:crudbuttonbar bean="#{sedesPlaats}" form="formPlaats" returnto="#{sedes.path}/plaatsen/plaatsen.xhtml" />
            </div>
          </div>
        </h:form>
      </div>
    </div>
  </ui:define>

  <ui:define name="modal">
    <d:confirmatie titel="#{i18nTeksten.tekst('sedes.titel.plaats.delete')}" />
  </ui:define>
</ui:composition>
