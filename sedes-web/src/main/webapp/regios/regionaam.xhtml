<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-8">
        <h:form id="formRegionaam">
          <d:titel titel="#{sedesRegio.detailSubTitel}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.taal')}" />
                <div class="field-body is-normal">
                  <d:listbox id="taal" value="#{sedesRegio.regionaam.taal}" items="#{doosRemote.talenIso6392t}" textvalue="#{doosRemote.taalIso6392t(sedesRegio.regionaam.taal)}" fullwidth="true" required="true" readonly="#{!sedesRegio.detailAktie.nieuw}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.regionaam')}" />
                <div class="field-body is-normal">
                  <d:inputText id="naam" value="#{sedesRegio.regionaam.naam}" maxlength="100" size="100" required="true" readonly="#{sedesRegio.detailAktie.readonly}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.land')}" />
                <div class="field-body is-normal">
                  <d:inputText id="officieleNaam" value="#{sedesLand.i18nLandnaam(sedesRegio.regio.landId)}" maxlength="255" size="100" readonly="true" />
                </div>
              </div>
            </div>
          </div>

          <d:crudbuttonbar bean="#{sedesRegio}" form="formRegionaam" detail="detail" returnto="#{sedes.path}/regios/regio.xhtml" />
        </h:form>
      </div>
    </div>
  </ui:define>
  <ui:define name="modal">
    <d:confirmatie titel="#{i18nTeksten.tekst('sedes.titel.regionaam.delete')}" />
  </ui:define>
</ui:composition>
